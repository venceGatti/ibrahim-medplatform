[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "medfactory"
version = "1.0.0"
description = "MedFactory Build-Time Knowledge Base and .medpack Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MedPlatform Team", email = "engineering@medplatform.local" }
]
dependencies = [
    "blake3==1.0.4",
    "cryptography==50.0.2",
    "docling-core==2.105.0",
    "fastapi==0.115.6",
    "numpy==2.2.3",
    "pandas==3.1.0",
    "pillow==11.1.0",
    "polars==1.21.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.16.2",
    "pyhpo==3.3.0",
    "pypdfium2==5.14.0",
    "zstandard==0.25.0"
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4"
]

[tool.setuptools.packages.find]
where = ["src"]
